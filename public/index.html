<!doctype html><html lang="zh-CN" data-theme="white"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="小布的记账本"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./glass.css"><title>小布的记账本</title></head><body>
<main class="app"><header><h1>小布的记账本</h1><div class="header-actions"><button id="openSummary">月总结</button><button id="cancelEdit" hidden>取消编辑</button><button id="openSettings" class="iconbutton" aria-label="设置"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1v4l-2 1 2 1v4l3 1 1 3h6l1-3 3-1v-4l2-1-2-1V7l-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<section class="balance"><div class="balance-label">总余额 <button id="openRecords">收支记录 ↗</button></div><div class="balance-value"><span>¥</span><strong id="balance">0.00</strong></div><div class="monthline"><span>本月收入 <b id="income">0.00</b></span><span>本月支出 <b id="expense">0.00</b></span></div></section>
<section class="entry-area"><div class="tabs" role="group" aria-label="收支类型"><button data-type="expense" class="selected">支出</button><button data-type="income">收入</button></div><div class="amountline"><span>¥</span><output id="amount" aria-label="记账金额" aria-live="polite">0.00</output><span class="amount-hint" id="amountHint">记一笔支出</span></div><div class="categoryhead"><span>分类</span><div><span class="swipe-hint">左右滑动</span><button id="manage">分类管理</button></div></div><div id="categories" class="categories" role="group" aria-label="大分类，可左右滑动" tabindex="0"></div><div class="inline-subsection"><div id="inlineSubcategories" tabindex="0" class="inline-subcategories" role="group" aria-label="细分类"></div></div><div class="entry-details"><button id="openDetails"><span id="detailLabel">今天 · 添加备注</span><span>⌄</span></button></div></section>
<section class="keypad" aria-label="金额数字键盘"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key=".">.</button><button data-key="0">0</button><button data-key="back" aria-label="删除一位">⌫</button></section><button class="primary save-button" id="saveEntry">记一笔支出</button></main>
<dialog id="settings"><div class="dialoghead"><h2>设置</h2><button data-close aria-label="关闭设置">✕</button></div><h3>主题颜色</h3><div id="themes" class="themes"></div><h3>数据备份</h3><div class="settingsbuttons"><button id="backupJson">导出备份</button><button id="restoreJson">恢复备份</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div><p class="muted">账单仅保存在本机，请定期备份。</p><h3>运行状态</h3><p id="offlineStatus" class="muted">正在检查…</p><p class="version">小布的记账本 · 图片分类版 2.8</p></dialog>
<dialog id="summaryDialog"><div class="dialoghead"><h2>月度总结</h2><button data-close aria-label="关闭月度总结">✕</button></div><input type="hidden" id="month"><div class="monthbar"><button id="monthPrev" aria-label="上个月">‹</button><button id="openMonthPicker" aria-haspopup="dialog"><span id="monthLabel"></span><span aria-hidden="true">⌄</span></button><button id="monthNext" aria-label="下个月">›</button></div><div class="summarybalance"><span>本月结余</span><strong id="monthBalance">¥ 0.00</strong></div><div class="summarymetrics"><span>收入 <b id="summaryIncome"></b></span><span>支出 <b id="summaryExpense"></b></span></div><p class="muted">当月结余 = 当月收入 − 当月支出</p><button id="openStats" class="soft-action">查看分类支出 ›</button><h3>每月结余</h3><div id="monthlyHistory" class="scroll-list" role="region" aria-label="每月结余，上下滑动查看" tabindex="0"></div></dialog>
<dialog id="recordsDialog"><div class="dialoghead"><h2>收支记录</h2><button data-close aria-label="关闭记录">✕</button></div><div id="records" class="scroll-list" role="region" aria-label="收支记录，上下滑动查看" tabindex="0"></div></dialog>
<dialog id="categoryDialog"><div class="dialoghead"><h2>分类管理</h2><button data-close aria-label="关闭分类管理">✕</button></div><form id="categoryForm"><div class="add-mode" role="group" aria-label="添加分类类型"><button type="button" data-add-mode="parent" class="selected">新建大分类</button><button type="button" data-add-mode="child">添加细分类</button></div><input type="hidden" id="parent"><div id="parentSection" hidden><span class="parent-label">选择所属大分类</span><div id="parentChoices" class="parent-choices" role="group" aria-label="所属大分类"></div></div><label for="categoryName">名称</label><input id="categoryName" required maxlength="16" placeholder="例如：日用品、书籍"><div class="photo-picker"><img id="categoryPhotoPreview" src="./assets/category-icons/generic.png" alt="分类图标预览" width="48" height="48"><div><button type="button" id="chooseCategoryPhoto">上传图片</button><span class="muted">选填 · 从相册选择</span></div><button type="button" id="clearCategoryPhoto" hidden>移除</button><input type="file" id="categoryPhotoFile" accept="image/*" hidden></div><button type="submit" class="primary">添加分类</button></form><h3>管理已有分类</h3><p class="muted">删除分类不会删除历史账单。点分类名称可展开细分类。</p><div id="categoryList"></div><input type="file" id="existingIconFile" accept="image/*" hidden></dialog>
<dialog id="detailsDialog"><div class="dialoghead"><h2>日期与备注</h2><button data-close aria-label="关闭日期与备注">✕</button></div><label for="date">日期</label><input type="date" id="date" required><label for="note">备注（选填）</label><input id="note" maxlength="80" placeholder="这笔钱花在哪？"><button id="confirmDetails" class="primary">完成</button></dialog><dialog id="monthPickerDialog" class="choice-dialog"><div class="dialoghead"><h2>选择月份</h2><button data-close aria-label="关闭月份选择">✕</button></div><div class="yearbar"><button id="yearPrev" aria-label="上一年">‹</button><strong id="pickerYear"></strong><button id="yearNext" aria-label="下一年">›</button></div><div id="monthChoices" class="month-grid"></div><button id="chooseThisMonth" class="soft-action">回到本月</button></dialog><dialog id="statsDialog"><div class="dialoghead"><h2>分类支出</h2><button data-close aria-label="关闭分类支出">✕</button></div><p id="statsTotal" class="muted"></p><div id="statsRows" class="scroll-list" role="region" aria-label="分类支出，上下滑动查看" tabindex="0"></div></dialog><div id="toast" role="status" class="toast" hidden></div><script src="./category-catalog.js"></script><script src="./category-photos.js"></script><script src="./app.js"></script><script src="./pwa.js"></script></body></html>
